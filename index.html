<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pairing Mind Logo Picker</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 700'%3E%3Cpath fill='%2326282B' d='M614.7 121C568 67 505.9 28.6 436.8 10.9 367.6-6.8 294.7-2.9 227.8 22 160.9 46.9 103.3 91.7 62.5 150.3 21.8 209 0 278.6 0 350s21.8 141 62.5 199.7c40.8 58.6 98.4 103.4 165.3 128.3 66.9 24.9 139.8 28.8 209 11.1 69.1-17.7 131.2-56.1 177.9-110.1-54.3-8.9-103.8-36.7-139.4-78.7C439.6 458.3 420 405.1 420 350s19.6-108.3 55.3-150.3c35.6-41.9 85.1-69.8 139.4-78.7Z'/%3E%3Ccircle cx='652' cy='350' r='168' fill='%23367CFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="title">
      <span class="eyebrow">Pairing Mind</span>
      <h1>Logo picker</h1>
    </div>
    <nav class="steps" aria-label="Steps"></nav>
  </div>
</header>

<section class="sofar" aria-label="Your logo so far">
  <div class="sofar-inner">
    <div class="sofar-preview" id="sofar-preview"></div>
    <div class="sofar-text">
      <span class="eyebrow">Your logo so far</span>
      <p id="sofar-summary"></p>
    </div>
    <div class="switch" role="group" aria-label="Preview background">
      <button data-surface="both" aria-pressed="true">Both</button>
      <button data-surface="light" aria-pressed="false">Light</button>
      <button data-surface="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</section>

<main id="main" class="main">
  <p class="loading">Loading fonts…</p>
</main>

<footer class="bottom">
  <button class="btn ghost" id="back">Back</button>
  <span id="step-count"></span>
  <button class="btn primary" id="next">Next</button>
</footer>

<script src="vendor/opentype.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
